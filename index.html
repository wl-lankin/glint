<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="spectrum-stroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd37a" />
          <stop offset="0.38" stop-color="#ff6aa6" />
          <stop offset="0.68" stop-color="#8b7bff" />
          <stop offset="1" stop-color="#46e3ff" />
        </linearGradient>
      </defs>
    </svg>
    <div id="app" class="app is-empty" data-theme="dark">
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="ambient" aria-hidden="true"><div class="glow"></div><div class="glow"></div></div>

      <main class="stage" id="stage" data-i18n-aria="aria.image">
        <div class="slide"><div class="kb"><img class="pic" alt="" draggable="false" /></div></div>
        <div class="slide"><div class="kb"><img class="pic" alt="" draggable="false" /></div></div>
        <div class="broken" hidden>
          <div class="broken-icon"></div>
          <div class="broken-title" data-i18n="broken.title"></div>
          <div class="broken-text"></div>
        </div>
      </main>

      <section class="empty" data-i18n-aria="aria.welcome">
        <div class="mark"><img src="/assets/logo.svg" alt="" width="128" height="128" /></div>
        <h1 class="wordmark">Glint</h1>
        <p class="tagline" data-i18n="start.tagline"></p>
        <button class="cta" data-action="open"><span data-i18n="start.open"></span><kbd data-key-open></kbd></button>
        <p class="hint" data-i18n="start.drop"></p>
        <div class="formats" data-i18n-aria="start.formats"></div>
        <p class="tip" data-i18n="start.tip"></p>
      </section>

      <header class="topbar hud" data-tauri-drag-region>
        <div class="traffic-space" data-tauri-drag-region></div>
        <div class="title" data-tauri-drag-region>
          <span class="name" data-tauri-drag-region></span>
          <span class="meta" data-tauri-drag-region></span>
          <button class="warn-chip" data-action="info" hidden></button>
        </div>
        <button class="update-pill" data-action="update" hidden><span class="update-dot"></span><span class="update-text"></span></button>
        <div class="tools">
          <button class="icon-btn" data-action="open" data-i18n-tip="tip.open"></button>
          <button class="icon-btn code-btn" data-action="code" data-i18n-tip="tip.code"></button>
          <button class="icon-btn" data-action="info" data-i18n-tip="tip.info"></button>
          <button class="icon-btn" data-action="palette" data-i18n-tip="tip.palette"></button>
          <button class="icon-btn" data-action="grid" data-i18n-tip="tip.grid"></button>
          <button class="icon-btn" data-action="ambient" data-i18n-tip="tip.ambient"></button>
          <button class="icon-btn" data-action="menu" data-i18n-tip="tip.more"></button>
        </div>
        <div class="win-controls">
          <button class="win-btn" data-action="win-min" data-i18n-aria="win.minimize"></button>
          <button class="win-btn" data-action="win-max" data-i18n-aria="win.maximize"></button>
          <button class="win-btn close" data-action="win-close" data-i18n-aria="win.close"></button>
        </div>
      </header>

      <div class="dock hud">
        <div class="strip" role="listbox" data-i18n-aria="aria.images"></div>
        <div class="controls">
          <button class="icon-btn" data-action="prev" data-i18n-tip="tip.prev"></button>
          <button class="play" data-action="play" data-i18n-tip="tip.play">
            <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" /><circle class="progress" cx="22" cy="22" r="20" /></svg>
            <span class="play-icon"></span>
          </button>
          <button class="icon-btn" data-action="next" data-i18n-tip="tip.next"></button>
          <span class="sep"></span>
          <button class="icon-btn" data-action="zoom-out" data-i18n-tip="tip.zoomOut"></button>
          <button class="zoom-label" data-action="zoom-toggle" data-i18n-tip="tip.zoomToggle">100%</button>
          <button class="icon-btn" data-action="zoom-in" data-i18n-tip="tip.zoomIn"></button>
          <span class="sep"></span>
          <button class="icon-btn" data-action="rotate" data-i18n-tip="tip.rotate"></button>
          <button class="icon-btn" data-action="flip" data-i18n-tip="tip.flip"></button>
          <button class="icon-btn" data-action="backdrop" data-i18n-tip="tip.backdrop"></button>
          <button class="icon-btn" data-action="loupe" data-i18n-tip="tip.loupe"></button>
          <span class="sep"></span>
          <button class="icon-btn" data-action="fullscreen" data-i18n-tip="tip.fullscreen"></button>
        </div>
      </div>

      <aside class="info-panel panel" data-i18n-aria="aria.info"></aside>
      <aside class="code-panel" data-i18n-aria="code.title"></aside>
      <div class="palette-panel panel" data-i18n-aria="aria.palette"></div>
      <section class="sheet" data-i18n-aria="aria.sheet"><div class="sheet-head"><span class="sheet-title"></span><button class="icon-btn" data-action="grid" data-i18n-aria="win.close"></button></div><div class="sheet-grid"></div></section>
      <canvas class="loupe" width="176" height="176" aria-hidden="true"></canvas>
      <div class="loupe-label" aria-hidden="true"></div>
      <div class="drop-zone" aria-hidden="true"><div class="drop-card"><div class="drop-glyph"></div><span data-i18n="drop"></span></div></div>
      <div class="menu" role="menu"></div>
      <div class="modal-layer"></div>
      <div class="toasts" aria-live="polite"></div>
      <div class="tooltip" role="tooltip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
